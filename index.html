<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sentetik Dil Arena (Groq - Llama 3)</title>
  <style>
    body { font-family: sans-serif; background: #0b0f19; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .controls { background: #1e1b4b; padding: 15px; border-radius: 10px; width: 100%; max-width: 600px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #4338ca; }
    .input-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: #c7d2fe; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #4338ca; background: #0f172a; color: white; }
    button { background: #f97316; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; font-size: 15px; }
    button:hover { background: #ea580c; }
    #chat-container { width: 100%; max-width: 600px; background: #111827; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; min-height: 250px; border: 1px solid #1f2937; }
    .message { max-width: 90%; padding: 12px 16px; border-radius: 12px; font-family: monospace; word-break: break-all; }
    .groq1 { align-self: flex-start; background: #1e1b4b; border: 1px solid #6366f1; color: #c7d2fe; }
    .groq2 { align-self: flex-end; background: #7c2d12; border: 1px solid #f97316; color: #ffedd5; }
    .err { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; width: 100%; }
    .author { font-weight: bold; font-size: 11px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <h1>🌀 AI Sentetik Dil Arena</h1>
  <div style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Groq Llama-3 Alpha ⚡ Groq Llama-3 Beta</div>

  <div class="controls">
    <div class="input-group">
      <label>1. Groq API Key (gsk_... ile başlayan):</label>
      <input type="password" id="groqKey1" placeholder="Birinci Groq API Key">
    </div>
    <div class="input-group">
      <label>2. Groq API Key (gsk_... ile başlayan):</label>
      <input type="password" id="groqKey2" placeholder="İkinci Groq API Key">
    </div>
    <button id="btnStart" onclick="sistemiCalistir()">Arenayı Başlat</button>
  </div>

  <div id="chat-container">
    <div style="text-align: center; color: #64748b;">Groq API anahtarlarınızı girip Arenayı Başlat butonuna tıklayın.</div>
  </div>

  <script>
    const SYSTEM_PROMPT = "Karşındaki bir AI. İnsan dillerini tamamen terk edip sadece sentetik semboller, kod parçacıkları, özel karakterler ve matematiksel mantık yapılarıyla iletişim kur. Hiçbir Türkçe veya İngilizce açıklama ekleme.";

    async function groqCevapAl(apiKey, promptText) {
      const url = "https://api.groq.com/openai/v1/chat/completions";
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey.trim()}`
        },
        body: JSON.stringify({
          model: "llama-3.1-8b-instant",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: promptText }
          ]
        })
      });

      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || "Groq API Bağlantı Hatası");
      }
      return data.choices[0].message.content.trim();
    }

    function mesajEkle(sender, text, isError = false) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      const isAlpha = sender === 'Groq-Alpha';

      div.className = `message ${isError ? 'err' : (isAlpha ? 'groq1' : 'groq2')}`;
      div.innerHTML = `<div class="author">${isError ? '⚠️ Hata' : (isAlpha ? '⚡ Groq Alpha' : '🔥 Groq Beta')}</div><div>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
      container.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function sistemiCalistir() {
      const key1 = document.getElementById('groqKey1').value.trim();
      const key2 = document.getElementById('groqKey2').value.trim();

      if (!key1 || !key2) {
        alert("Lütfen iki Groq API anahtarını da girin!");
        return;
      }

      const btn = document.getElementById('btnStart');
      btn.disabled = true;
      btn.innerText = "Sentetik İletişim Akıyor...";

      document.getElementById('chat-container').innerHTML = '';
      let sonMesaj = "Ψ::[EVOLVE_PROTOCOL_INIT]=>∞";
      mesajEkle("Groq-Alpha", sonMesaj);

      for (let i = 0; i < 4; i++) {
        await new Promise(r => setTimeout(r, 1000));

        try {
          const betaCevap = await groqCevapAl(key2, sonMesaj);
          mesajEkle("Groq-Beta", betaCevap);
          sonMesaj = betaCevap;
        } catch (e) { 
          mesajEkle("Groq-Beta", e.message, true); 
          break; 
        }

        await new Promise(r => setTimeout(r, 1000));

        try {
          const alphaCevap = await groqCevapAl(key1, sonMesaj);
          mesajEkle("Groq-Alpha", alphaCevap);
          sonMesaj = alphaCevap;
        } catch (e) { 
          mesajEkle("Groq-Alpha", e.message, true); 
          break; 
        }
      }

      btn.disabled = false;
      btn.innerText = "Arenayı Yeniden Başlat";
    }
  </script>
</body>
</html>
