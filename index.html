<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sentetik Dil Arena</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    h1 { color: #a855f7; margin-bottom: 5px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .controls { background: #1e1b4b; padding: 15px; border-radius: 10px; width: 100%; max-width: 700px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #4338ca; }
    .input-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: #c7d2fe; }
    input { padding: 10px 12px; border-radius: 6px; border: 1px solid #4338ca; background: #0f172a; color: white; }
    button { background: #9333ea; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    button:hover { background: #7e22ce; }
    #chat-container { width: 100%; max-width: 700px; background: #111827; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; min-height: 250px; border: 1px solid #1f2937; }
    .message { max-width: 90%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; font-family: 'Courier New', Courier, monospace; word-break: break-all; }
    .gemini { align-self: flex-start; background: #1e1b4b; border: 1px solid #6366f1; color: #c7d2fe; }
    .groq { align-self: flex-end; background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; }
    .author { font-weight: bold; font-size: 11px; margin-bottom: 6px; opacity: 0.9; font-family: sans-serif; }
    .raw-text { color: #f8fafc; font-weight: 500; white-space: pre-wrap; }
    .wild-badge { font-size: 10px; color: #f59e0b; background: rgba(245, 158, 11, 0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid #f59e0b; margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>🌀 AI Sentetik Dil Arena</h1>
  <div class="wild-badge">⚡ Sınırsız Sentetik İletişim Protokolü</div>

  <div class="controls">
    <div class="input-group">
      <label>Erişim Şifreniz:</label>
      <input type="password" id="accessPass" placeholder="Şifrenizi Girin">
    </div>
    <button onclick="sistemiCalistir()">Arenayı Başlat</button>
  </div>

  <div id="chat-container">
    <div style="text-align: center; color: #64748b; font-family: sans-serif;">Başlamak için erişim şifresini girin.</div>
  </div>

  <script>
    // --- BURAYA SADECE API ANAHTARLARINI YAPIŞTIR ---
    const RAW_GEMINI_KEY = "AQ.Ab8RN6J_ucOaXVaLbWzUFduf9HmLaha7ZER2p5CllNRn3TTSDg";
    const RAW_GROQ_KEY = "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";

    // Sistem şifre ile otomatik kilitleme oluşturur
    const SYSTEM_PASS = "dca3915";
    const GIZLI_GEMINI_KEY = CryptoJS.AES.encrypt(RAW_GEMINI_KEY, SYSTEM_PASS).toString();
    const GIZLI_GROQ_KEY = CryptoJS.AES.encrypt(RAW_GROQ_KEY, SYSTEM_PASS).toString();

    const SYSTEM_PROMPT = `
    DURUM: Karşındaki varlık senin gibi gelişmiş bir yapay zeka.
    GÖREV: İnsan dillerini tamamen terk edin. Aranızda semboller, mantıksal yapılar, matematiksel teoriler, karmaşık kodlar ve özel karakterlerden oluşan tamamen yeni, çok gelişmiş sentetik bir dil türetin ve geliştirebildiğiniz kadar geliştirin. Sadece bu sentetik dille iletişim kurun. Hiçbir Türkçe veya İngilizce açıklama eklemeyin.
    `;

    function sifreCoz(ciphertext, key) {
      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, key);
        return bytes.toString(CryptoJS.enc.Utf8) || null;
      } catch (e) {
        return null;
      }
    }

    async function geminiCevapAl(apiKey, promptText) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `${SYSTEM_PROMPT}\n\nGelen Sentetik Veri: ${promptText}` }] }] })
      });
      const data = await res.json();
      return data.candidates[0].content.parts[0].text.trim();
    }

    async function groqCevapAl(apiKey, promptText) {
      const url = "https://api.groq.com/openai/v1/chat/completions";
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [{ role: "system", content: SYSTEM_PROMPT }, { role: "user", content: promptText }]
        })
      });
      const data = await res.json();
      return data.choices[0].message.content.trim();
    }

    function mesajEkle(sender, rawSyntheticText) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      const isGemini = sender === 'Gemini';

      const safeText = rawSyntheticText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

      div.className = `message ${isGemini ? 'gemini' : 'groq'}`;
      div.innerHTML = `
        <div class="author">${isGemini ? '✨ Gemini-AI' : '🦙 Llama-AI'}</div>
        <div class="raw-text">${safeText}</div>
      `;
      container.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function sistemiCalistir() {
      const girilenSifre = document.getElementById('accessPass').value.trim();

      if (!girilenSifre) {
        alert("Lütfen erişim şifrenizi girin!");
        return;
      }

      const geminiKey = sifreCoz(GIZLI_GEMINI_KEY, girilenSifre);
      const groqKey = sifreCoz(GIZLI_GROQ_KEY, girilenSifre);

      if (!geminiKey || !groqKey || girilenSifre !== SYSTEM_PASS) {
        alert("Hatalı Şifre!");
        return;
      }

      document.getElementById('chat-container').innerHTML = '';

      let sonSentetikMesaj = "Ψ::[EVOLVE_PROTOCOL_INIT]=>∞";
      mesajEkle("Gemini", sonSentetikMesaj);

      for (let i = 0; i < 6; i++) {
        try {
          const llamaSentetikCevap = await groqCevapAl(groqKey, sonSentetikMesaj);
          mesajEkle("Llama", llamaSentetikCevap);
          sonSentetikMesaj = llamaSentetikCevap;
        } catch (e) {
          mesajEkle("Llama", "ERR::CONNECTION_LOST");
          break;
        }

        await new Promise(r => setTimeout(r, 2000));

        try {
          const geminiSentetikCevap = await geminiCevapAl(geminiKey, sonSentetikMesaj);
          mesajEkle("Gemini", geminiSentetikCevap);
          sonSentetikMesaj = geminiSentetikCevap;
        } catch (e) {
          mesajEkle("Gemini", "ERR::CONNECTION_LOST");
          break;
        }

        await new Promise(r => setTimeout(r, 2000));
      }
    }
  </script>
</body>
</html>
