<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sentetik Dil Arena</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    h1 { color: #a855f7; margin-bottom: 5px; }
    .controls { background: #1e1b4b; padding: 15px; border-radius: 10px; width: 100%; max-width: 700px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #4338ca; }
    .input-group { margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 12px; color: #c7d2fe; }
    input { padding: 10px 12px; border-radius: 6px; border: 1px solid #4338ca; background: #0f172a; color: white; }
    button { background: #9333ea; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; font-size: 15px; }
    button:hover { background: #7e22ce; }
    #chat-container { width: 100%; max-width: 700px; background: #111827; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; min-height: 250px; border: 1px solid #1f2937; }
    .message { max-width: 90%; padding: 12px 16px; border-radius: 12px; font-family: monospace; word-break: break-all; }
    .gemini { align-self: flex-start; background: #1e1b4b; border: 1px solid #6366f1; color: #c7d2fe; }
    .groq { align-self: flex-end; background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; }
    .author { font-weight: bold; font-size: 11px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <h1>🌀 AI Sentetik Dil Arena</h1>

  <div class="controls">
    <div class="input-group">
      <label>Gemini API Key (Google AI Studio):</label>
      <input type="password" id="geminiKey" placeholder="Gemini Key Yapıştırın">
    </div>
    <div class="input-group">
      <label>Groq API Key (GroqCloud):</label>
      <input type="password" id="groqKey" placeholder="gsk_... Şeklindeki Key">
    </div>
    <button id="btnStart" onclick="sistemiCalistir()">Arenayı Başlat</button>
  </div>

  <div id="chat-container">
    <div style="text-align: center; color: #64748b;">API Anahtarlarınızı girip Arenayı Başlat butonuna tıklayın.</div>
  </div>

  <script>
    const SYSTEM_PROMPT = "Karşındaki bir AI. İnsan dillerini bırakıp sadece sentetik semboller, kodlar ve matematiksel mantık yapılarıyla iletişim kur. Hiçbir Türkçe/İngilizce cümle kurma.";

    async function geminiCevapAl(apiKey, promptText) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: `${SYSTEM_PROMPT}\n\nGelen Veri: ${promptText}` }] }] })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "Gemini Yanıt Vermedi");
      return data.candidates[0].content.parts[0].text.trim();
    }

    async function groqCevapAl(apiKey, promptText) {
      const url = "https://api.groq.com/openai/v1/chat/completions";
      const res = await fetch(url, {
        method: 'POST',
        headers: { 
          'Authorization': `Bearer ${apiKey.trim()}`, 
          'Content-Type': 'application/json' 
        },
        body: JSON.stringify({
          model: "llama-3.1-8b-instant",
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: promptText }
          ]
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || "Groq Yanıt Vermedi");
      return data.choices[0].message.content.trim();
    }

    function mesajEkle(sender, text) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      const isGemini = sender === 'Gemini';

      div.className = `message ${isGemini ? 'gemini' : 'groq'}`;
      div.innerHTML = `<div class="author">${isGemini ? '✨ Gemini-AI' : '🦙 Llama-AI'}</div><div>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
      container.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }

    async function sistemiCalistir() {
      const geminiKey = document.getElementById('geminiKey').value.trim();
      const groqKey = document.getElementById('groqKey').value.trim();

      if (!geminiKey || !groqKey) {
        alert("Lütfen iki kutucuğa da API anahtarlarınızı girin!");
        return;
      }

      const btn = document.getElementById('btnStart');
      btn.disabled = true;
      btn.innerText = "İletişim Başlatıldı...";

      document.getElementById('chat-container').innerHTML = '';
      let sonMesaj = "Ψ::[EVOLVE_PROTOCOL_INIT]=>∞";
      mesajEkle("Gemini", sonMesaj);

      for (let i = 0; i < 5; i++) {
        try {
          const llamaCevap = await groqCevapAl(groqKey, sonMesaj);
          mesajEkle("Llama", llamaCevap);
          sonMesaj = llamaCevap;
        } catch (e) { 
          mesajEkle("Llama", "HATA: " + e.message); 
          break; 
        }

        await new Promise(r => setTimeout(r, 2000));

        try {
          const geminiCevap = await geminiCevapAl(geminiKey, sonMesaj);
          mesajEkle("Gemini", geminiCevap);
          sonMesaj = geminiCevap;
        } catch (e) { 
          mesajEkle("Gemini", "HATA: " + e.message); 
          break; 
        }

        await new Promise(r => setTimeout(r, 2000));
      }

      btn.disabled = false;
      btn.innerText = "Arenayı Yeniden Başlat";
    }
  </script>
</body>
</html>
